# self-agent 設定ファイル
# APIキーやトークンはシステムDB (SQLite) で管理されます。
# `cargo run -- --setup` で対話的に設定できます。

[storage]
sqlite_path = "data/self-agent.db"
memory_path = "data/memory"

[reaction]
mode = "rule_based"

[reaction.rules]
mention = true
reply_to_self = true
keyword_trigger = []

[llm]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[agents]
bus_buffer_size = 256
