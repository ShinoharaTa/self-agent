<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11141c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="self-agent v3">
  <title>self-agent</title>
  <link rel="manifest" href="/static/manifest-v3.webmanifest">
  <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/c-atoms.css">
  <link rel="stylesheet" href="/static/c-list.css">
  <link rel="stylesheet" href="/static/c-shell.css">
  <script src="/static/ui.js" defer></script>
  <script src="/static/api.js" defer></script>
  <script src="/static/sound.js" defer></script>
  <script src="/static/chat.js" defer></script>
  <script src="/static/views.js" defer></script>
  <script src="/static/topics.js" defer></script>
  <script type="module" src="/static/c-app.js"></script>
  <script src="/static/shell.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#ed">本文へ</a>
  <div class="v3" id="v3" data-view="list" data-hand="closed" data-hand-mode="over">
    <nav class="v3-list" id="v3-list" aria-label="話題">
      <header class="v3-list-head">
        <span class="v3-brand">self-agent</span>
        <span class="v3-head-ops" id="v3-head-ops"></span>
      </header>
      <div class="v3-search" id="v3-search-box" hidden></div>
      <div class="v3-slot" id="c-list-root"></div>
      <div class="v3-slot" id="c-bottom-root"></div>
    </nav>
    <main class="v3-main" id="v3-main">
      <div class="v3-bar" id="v3-bar" hidden>
        <button class="btn btn-ghost btn-sm v3-place" id="v3-place" type="button" aria-haspopup="dialog" hidden></button>
        <div class="segmented segmented-sm v3-views" id="v3-views" role="group" aria-label="見る物" hidden></div>
        <button class="btn btn-ghost btn-sm v3-hand-open" id="v3-hand-open" type="button" aria-controls="v3-hand"></button>
      </div>
      <div class="ed" id="ed"></div>
    </main>
    <aside class="v3-hand" id="v3-hand" aria-label="右腕">
      <button class="btn btn-ghost btn-sm btn-icon-sm v3-hand-show" id="v3-hand-show" type="button" aria-controls="v3-hand-ed" aria-expanded="false"></button>
      <div class="ed v3-hand-ed" id="v3-hand-ed"></div>
    </aside>
    <div class="v3-hand-backdrop" id="v3-hand-backdrop" hidden></div>
  </div>
  <dialog id="v3-sheet" class="v3-sheet"></dialog>
  <dialog id="v3-start" class="v3-start" aria-labelledby="v3-start-title">
    <form class="stack" id="v3-start-form" novalidate>
      <h2 id="v3-start-title" class="dlg-title">話題を始める</h2>
      <div class="field">
        <label for="v3-start-place">場所</label>
        <select class="select" id="v3-start-place" aria-describedby="v3-start-hint"></select>
      </div>
      <div class="field">
        <label for="v3-start-text">最初の一言</label>
        <textarea class="textarea" id="v3-start-text" rows="4" maxlength="1900" enterkeyhint="enter" aria-describedby="v3-start-error"></textarea>
      </div>
      <div class="field">
        <label for="v3-start-name">題名（省くと最初の一言から付けます）</label>
        <input class="input" id="v3-start-name" type="text" maxlength="100" autocomplete="off" enterkeyhint="go" aria-describedby="v3-start-error">
      </div>
      <div class="alert-slot"><p class="alert" id="v3-start-error" role="alert" hidden></p></div>
      <p class="meta" id="v3-start-hint"></p>
      <div class="dialog-actions">
        <button class="btn btn-secondary btn-sm" id="v3-start-cancel" type="button">やめる</button>
        <button class="btn btn-primary btn-sm" id="v3-start-ok" type="submit">始める</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-confirm" aria-labelledby="dlg-confirm-title" aria-describedby="dlg-confirm-target dlg-confirm-body">
    <h2 id="dlg-confirm-title" class="dlg-title"></h2>
    <p id="dlg-confirm-target" class="dlg-target" hidden></p>
    <p id="dlg-confirm-body" class="meta"></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary btn-sm" id="dlg-confirm-cancel" type="button">やめる</button>
      <button class="btn btn-primary btn-sm" id="dlg-confirm-ok" type="button">実行する</button>
    </div>
  </dialog>

  <div class="toast-region">
    <div class="toast-stack" id="toast" role="status" aria-atomic="false" hidden></div>
    <div class="toast-stack" id="toast-alert" role="alert" aria-atomic="false" hidden></div>
  </div>
</body>
</html>
